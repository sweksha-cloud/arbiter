# Weekly dependency updates, grouped so minor and patch bumps arrive as one PR
# per ecosystem instead of one each (TRADEOFFS.md 34). Security fixes still
# arrive right away as their own PRs (Dependabot security updates are on).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /apps/server
    schedule: { interval: weekly, day: monday }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday }
    groups:
      actions:
        patterns: ['*']
