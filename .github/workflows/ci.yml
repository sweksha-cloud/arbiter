name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels older runs, except on main, where a cancelled run
  # could stop a deploy halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arbiter
          POSTGRES_PASSWORD: arbiter
          POSTGRES_DB: arbiter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arbiter -d arbiter"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on high or critical advisories. Moderate ones in dev-only tools are reviewed by hand (SECURITY.md).
      - run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
        env:
          DATABASE_URL: postgres://arbiter:arbiter@localhost:5432/arbiter
      - run: pnpm build
      # The production server image must keep building (deploy/docker-compose.yml uses it).
      - run: docker build -f apps/server/Dockerfile -t arbiter-server .
      - run: pnpm exec playwright install --with-deps chromium webkit firefox
      - run: pnpm exec playwright test
        env:
          DATABASE_URL: postgres://arbiter:arbiter@localhost:5432/arbiter
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Every push to main that passes all checks goes live (TRADEOFFS.md 8c).
  # No SSH and no stored AWS keys: GitHub signs in to AWS for this run only
  # (OIDC), and AWS Systems Manager runs deploy/deploy.sh on the server, which
  # rolls back if the new version isn't healthy.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/sweksha-cloud/arbiter-server
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Deploy on the server and wait for its health check
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
        run: |
          commands=$(jq -cn --arg sha "$SHA" '{commands: [
            "set -e",
            "cd /home/ubuntu/arbiter",
            "sudo -u ubuntu git fetch -q origin main",
            ("sudo -u ubuntu git reset -q --hard " + $sha),
            ("deploy/deploy.sh " + $sha)
          ]}')
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "Deploy $SHA" --timeout-seconds 600 --parameters "$commands" \
            --query Command.CommandId --output text)
          echo "SSM command $id"
          for _ in $(seq 1 120); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Result: $status"
          [ "$status" = Success ]
      - name: Check the live server answers
        run: curl -fsS --retry 5 --retry-delay 3 https://arbiter-sweksha.duckdns.org/health
