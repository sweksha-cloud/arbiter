name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels older runs, except on main, where a cancelled run
  # could stop a deploy halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arbiter
          POSTGRES_PASSWORD: arbiter
          POSTGRES_DB: arbiter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arbiter -d arbiter"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on high or critical advisories. Moderate ones in dev-only tools are reviewed by hand (SECURITY.md).
      - run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
        env:
          DATABASE_URL: postgres://arbiter:arbiter@localhost:5432/arbiter
      - run: pnpm build
      # The production server image must keep building (deploy/docker-compose.yml uses it).
      - run: docker build -f apps/server/Dockerfile -t arbiter-server .
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm exec playwright test
        env:
          DATABASE_URL: postgres://arbiter:arbiter@localhost:5432/arbiter
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Every push to main that passes all checks goes live (TRADEOFFS.md 8c).
  # No stored keys: GitHub signs in to Google Cloud for this run only
  # (Workload Identity Federation), then runs deploy/deploy.sh on the server
  # through Google's IAP tunnel. The script rolls back if the new version
  # isn't healthy.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/sweksha-cloud/arbiter-server
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy on the server and wait for its health check
        env:
          SHA: ${{ github.sha }}
        run: |
          gcloud compute ssh ubuntu@arbiter --project "${{ vars.GCP_PROJECT }}" --zone us-west1-b \
            --tunnel-through-iap --quiet --command "set -e
              cd ~/arbiter
              git fetch -q origin main
              git reset -q --hard $SHA
              sudo deploy/deploy.sh $SHA"
      - name: Check the live server answers
        run: curl -fsS --retry 5 --retry-delay 3 https://arbiter-sweksha.duckdns.org/health
