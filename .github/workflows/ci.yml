name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  # A newer push cancels older runs, except on main, where a cancelled run
  # could stop a deploy halfway.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arbiter
          POSTGRES_PASSWORD: arbiter
          POSTGRES_DB: arbiter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arbiter -d arbiter"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Fails on high or critical advisories. Moderate ones in dev-only tools are reviewed by hand (SECURITY.md).
      - run: pnpm audit --audit-level high
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
        env:
          DATABASE_URL: postgres://arbiter:arbiter@localhost:5432/arbiter
          REDIS_URL: redis://localhost:6379
      - run: pnpm build

  # Monitoring config (TRADEOFFS.md 33): Prometheus and Alertmanager configs
  # are valid, and the alert rules pass their unit tests, with the same
  # versions the server runs.
  monitoring-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Prometheus config and alert rules
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/etc/monitoring:ro" --entrypoint promtool \
            prom/prometheus:v3.16.0 check config /etc/monitoring/prometheus.yml
      - name: Alert and SLO rule unit tests
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/m:ro" -w /m --entrypoint promtool \
            prom/prometheus:v3.16.0 test rules alerts.test.yml slo.test.yml
      - name: Alertmanager config
        run: |
          docker run --rm -v "$PWD/deploy/monitoring:/etc/monitoring:ro" --entrypoint amtool \
            prom/alertmanager:v0.35.0 check-config /etc/monitoring/alertmanager.yml
      - name: Grafana dashboard is valid JSON
        run: python3 -m json.tool deploy/monitoring/grafana/dashboards/arbiter.json > /dev/null

  # The server image, built once, side by side with the tests (TRADEOFFS.md 20d).
  # On main it's pushed under the commit SHA; deploy ships that exact image only
  # after every check passes. Elsewhere it's just built, to prove it still builds.
  # Supply chain (TRADEOFFS.md 34): the image is scanned before it can ship,
  # its SBOM is kept, and on main the pushed image is signed with a keyless
  # cosign signature (GitHub's OIDC identity, no stored keys).
  server-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/sweksha-cloud/arbiter-server
      TRIVY: aquasec/trivy:0.76.2
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      # Build once into the local Docker engine so it can be scanned before any push.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          load: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image (fails on fixable high or critical vulnerabilities)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image \
            --quiet --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "$IMAGE:${{ github.sha }}"
      - name: SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY" image \
            --quiet --format cyclonedx "$IMAGE:${{ github.sha }}" > sbom.cdx.json
      - uses: actions/upload-artifact@v7
        with:
          name: server-image-sbom
          path: sbom.cdx.json
      - uses: docker/login-action@v4
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same build, from cache: only now, after the scan, is it pushed.
      - id: push
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
      - uses: sigstore/cosign-installer@v4.1.3
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      - name: Sign the image and attach its SBOM (keyless)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "$IMAGE@$DIGEST"
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "$IMAGE@$DIGEST"

  # Browser tests, one GitHub machine per engine, side by side with `check`
  # (TRADEOFFS.md 20d). Each machine builds the app and runs its own server.
  browser-tests:
    runs-on: ubuntu-latest
    strategy:
      # Let both finish, so one failing browser still shows the other's results.
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            projects: --project=flows --project=server-restart
          - browser: webkit
            projects: --project=flows-webkit
    name: browser tests (${{ matrix.browser }})
    # Playwright's ready-made machine image: the browsers and their system
    # libraries are already installed, so nothing is downloaded each run. Its
    # version must match @playwright/test in package.json (pinned exactly).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --user 1001
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: arbiter
          POSTGRES_PASSWORD: arbiter
          POSTGRES_DB: arbiter
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arbiter -d arbiter"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright test ${{ matrix.projects }}
        env:
          DATABASE_URL: postgres://arbiter:arbiter@postgres:5432/arbiter
          REDIS_URL: redis://redis:6379
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # Every push to main that passes all checks goes live (TRADEOFFS.md 8c).
  # No stored keys: GitHub signs in to Google Cloud for this run only
  # (Workload Identity Federation), then runs deploy/deploy.sh on the server
  # through Google's IAP tunnel. The script rolls back if the new version
  # isn't healthy.
  deploy:
    needs: [check, browser-tests, server-image, monitoring-config]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/sweksha-cloud/arbiter-server
    steps:
      # Only the key clean-up script is needed. Checked out first: a checkout
      # after signing in to Google would delete the sign-in's credentials file.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: gcp
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The image server-image built and tested alongside; only now, with every
      # check passed, does it also become `latest`. No rebuild.
      - run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE:${{ github.sha }}"
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - name: Deploy on the server and wait for its health check
        env:
          SHA: ${{ github.sha }}
        run: |
          gcloud compute ssh ubuntu@arbiter --project "${{ vars.GCP_PROJECT }}" --zone us-west1-b \
            --tunnel-through-iap --quiet --ssh-key-expire-after=15m --command "set -e
              cd ~/arbiter
              git fetch -q origin main
              git reset -q --hard $SHA
              sudo deploy/deploy.sh $SHA"
      - name: Check the live server answers
        run: curl -fsS --retry 5 --retry-delay 3 https://arbiter-sweksha.duckdns.org/health
      # Each run's SSH key would otherwise stay on the VM for good (BUG-023).
      - name: Remove old CI SSH keys from the server
        if: always()
        run: gcp/prune-ssh-keys.sh "${{ vars.GCP_PROJECT }}" us-west1-b arbiter
