# Local development database. Production uses Neon (see docs/DESIGN.md).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: arbiter
      POSTGRES_PASSWORD: arbiter
      POSTGRES_DB: arbiter
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U arbiter -d arbiter']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
