<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#211b38" />
    <title>Offline · Arbiter</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fce4d8;
        --surface: #fffaf6;
        --text: #2a1f33;
        --muted: #6b5d73;
        --accent: #c8104f;
        --border: #f0cdbd;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #211b38;
          --surface: #2d2550;
          --text: #f6f1ff;
          --muted: #ddd4ec;
          --accent: #ff8a6b;
          --border: #74649c;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        box-sizing: border-box;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        line-height: 1.5;
      }
      main {
        max-width: 380px;
        padding: 28px 24px;
        border-radius: 18px;
        border: 1px solid var(--border);
        background: var(--surface);
        text-align: center;
      }
      h1 {
        margin: 12px 0 8px;
        font-size: 1.5rem;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      a {
        display: inline-block;
        padding: 12px 24px;
        border-radius: 999px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      svg {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 20h.01" />
        <path d="M8.5 16.429a5 5 0 0 1 7 0" />
        <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
        <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
        <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
        <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
        <path d="m2 2 20 20" />
      </svg>
      <h1>You're offline</h1>
      <p>Arbiter needs a connection to find places and keep everyone's swipes in sync. Your session is saved: reconnect and pick up where you left off.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
