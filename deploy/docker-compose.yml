# Production on one VM: the API server behind Caddy (HTTPS).
# Run from the repo root on the server:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Steps and settings: .claude/docs/DEPLOY.md

services:
  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    # Secrets and settings live in deploy/server.env on the server (never in git).
    env_file: server.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '4000'
      # Caddy is the only way in, so its X-Forwarded-For is trustworthy.
      TRUST_PROXY: 'true'
    # Not published: only Caddy can reach it.
    expose:
      - '4000'
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '5' }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN, e.g. arbiter-api.duckdns.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates survive restarts, so Let's Encrypt isn't asked again (it rate-limits).
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
