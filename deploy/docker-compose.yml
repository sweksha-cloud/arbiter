# Production on one VM: the API server behind Caddy (HTTPS).
# Deploys are automatic and have no downtime (TRADEOFFS.md 8e): CI builds the
# server image and runs deploy/deploy.sh <commit SHA>, which starts it in the
# idle slot (blue or green), waits until it's healthy, then stops the old
# one; Caddy always has a healthy slot to send traffic to. deploy/.env records
# each slot's image tag and which slot is live. In an emergency, build here:
#   docker compose -f deploy/docker-compose.yml build server-blue
# Steps and settings: gcp/README.md

# Both slots run the same image; only the tag differs.
x-server: &server
  build:
    context: ..
    dockerfile: apps/server/Dockerfile
  restart: unless-stopped
  # Secrets and settings live in deploy/server.env on the server (never in git).
  env_file: server.env
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: '4000'
    # Caddy is the only way in, so its X-Forwarded-For is trustworthy.
    TRUST_PROXY: 'true'
    # Live sessions, kept through restarts and deploys (TRADEOFFS.md 10b).
    REDIS_URL: redis://redis:6379
  depends_on:
    redis:
      condition: service_healthy
  # Not published: only Caddy can reach it.
  expose:
    - '4000'
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '5' }

services:
  server-blue:
    <<: *server
    # Built and tested by CI; the tag is a commit SHA (deploy.sh sets it in deploy/.env).
    image: ghcr.io/sweksha-cloud/arbiter-server:${SERVER_BLUE_TAG:-latest}

  server-green:
    <<: *server
    image: ghcr.io/sweksha-cloud/arbiter-server:${SERVER_GREEN_TAG:-latest}

  # Live session state. Never restarted by deploys (deploy.sh only replaces
  # the server), and saved to disk every second, so a VM reboot keeps
  # sessions too. Not published: only the server reaches it.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >-
      redis-server --appendonly yes --appendfsync everysec
      --maxmemory 64mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Caddy starts on its own: it only sends traffic to whichever slot is healthy.
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN, e.g. arbiter-api.duckdns.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates survive restarts, so Let's Encrypt isn't asked again (it rate-limits).
      - caddy-data:/data
      - caddy-config:/config

  # Monitoring (TRADEOFFS.md 33). The VM has 1 GB, so every piece has a hard
  # memory cap: if one outgrows it, that container restarts, never the app.
  # GOMEMLIMIT makes the Go programs collect garbage before reaching the cap.
  # Nothing here is published to the internet; ports are bound to localhost
  # for an SSH tunnel (gcp/README.md).
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    command:
      - --config.file=/etc/monitoring/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=1GB
    environment:
      GOMEMLIMIT: 110MiB
    mem_limit: 160m
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - 127.0.0.1:9090:9090
    volumes:
      # The folder, not single files: git replaces files on checkout, and a
      # single-file mount keeps showing the old one.
      - ./monitoring:/etc/monitoring:ro
      - prometheus-data:/prometheus
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  alertmanager:
    image: prom/alertmanager:v0.35.0
    restart: unless-stopped
    command:
      - --config.file=/etc/monitoring/alertmanager.yml
      - --storage.path=/alertmanager
    environment:
      GOMEMLIMIT: 32MiB
    mem_limit: 48m
    ports:
      - 127.0.0.1:9093:9093
    volumes:
      - ./monitoring:/etc/monitoring:ro
      # deploy/alerting/ntfy-url: the private phone-alert address (not in git).
      - ./alerting:/etc/alerting:ro
      - alertmanager-data:/alertmanager
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  # On the host's network so it sees the VM's real network interface.
  # Port 9100 is closed to the internet by the Google Cloud firewall.
  node-exporter:
    image: prom/node-exporter:v1.13.1
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=:9100
    environment:
      GOMEMLIMIT: 20MiB
    mem_limit: 32m
    volumes:
      - /:/host:ro,rslave
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  # The dashboard is started only when someone looks at it, so it doesn't
  # hold ~80 MB the rest of the time:
  #   docker compose -f deploy/docker-compose.yml --profile dashboard up -d grafana
  grafana:
    image: grafana/grafana:13.2.6
    profiles: [dashboard]
    restart: 'no'
    environment:
      # Reachable only through an SSH tunnel to localhost, so no login.
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_ANALYTICS_REPORTING_ENABLED: 'false'
      GF_ANALYTICS_CHECK_FOR_UPDATES: 'false'
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/monitoring/grafana/dashboards/arbiter.json
    mem_limit: 192m
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - ./monitoring:/etc/monitoring:ro
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

volumes:
  redis-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  alertmanager-data:
