# Production on one VM: the API server behind Caddy (HTTPS).
# Deploys are automatic and have no downtime (TRADEOFFS.md 8e): CI builds the
# server image and runs deploy/deploy.sh <commit SHA>, which starts it in the
# idle slot (blue or green), waits until it's healthy, then stops the old
# one; Caddy always has a healthy slot to send traffic to. deploy/.env records
# each slot's image tag and which slot is live. In an emergency, build here:
#   docker compose -f deploy/docker-compose.yml build server-blue
# Steps and settings: gcp/README.md

# Both slots run the same image; only the tag differs.
x-server: &server
  build:
    context: ..
    dockerfile: apps/server/Dockerfile
  restart: unless-stopped
  # Secrets and settings live in deploy/server.env on the server (never in git).
  env_file: server.env
  environment:
    NODE_ENV: production
    HOST: 0.0.0.0
    PORT: '4000'
    # Caddy is the only way in, so its X-Forwarded-For is trustworthy.
    TRUST_PROXY: 'true'
    # Live sessions, kept through restarts and deploys (TRADEOFFS.md 10b).
    REDIS_URL: redis://redis:6379
  depends_on:
    redis:
      condition: service_healthy
  # Not published: only Caddy can reach it.
  expose:
    - '4000'
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: '5' }

services:
  server-blue:
    <<: *server
    # Built and tested by CI; the tag is a commit SHA (deploy.sh sets it in deploy/.env).
    image: ghcr.io/sweksha-cloud/arbiter-server:${SERVER_BLUE_TAG:-latest}

  server-green:
    <<: *server
    image: ghcr.io/sweksha-cloud/arbiter-server:${SERVER_GREEN_TAG:-latest}

  # Live session state. Never restarted by deploys (deploy.sh only replaces
  # the server), and saved to disk every second, so a VM reboot keeps
  # sessions too. Not published: only the server reaches it.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >-
      redis-server --appendonly yes --appendfsync everysec
      --maxmemory 64mb --maxmemory-policy noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '3' }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Caddy starts on its own: it only sends traffic to whichever slot is healthy.
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN, e.g. arbiter-api.duckdns.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates survive restarts, so Let's Encrypt isn't asked again (it rate-limits).
      - caddy-data:/data
      - caddy-config:/config

volumes:
  redis-data:
  caddy-data:
  caddy-config:
